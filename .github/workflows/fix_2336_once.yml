name: 修正2336多页拆图结果

on:
  push:
    branches: [main]
    paths:
      - '.2336-fix-trigger'

permissions:
  contents: read

concurrency:
  group: split-drawing-production
  cancel-in-progress: false

jobs:
  fix2336:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
      GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
      GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_ROOT_FOLDER_ID: '1zM-DIWR_7ruB-41G7VETmVmCnKqB2WqM'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: 恢复基础数据缓存
        uses: actions/cache/restore@v4
        with:
          path: .source_cache
          key: split-source-v1-${{ runner.os }}-${{ hashFiles('source_cache.py', 'source_reader.py', 'models.py') }}-${{ github.run_id }}
          restore-keys: |
            split-source-v1-${{ runner.os }}-${{ hashFiles('source_cache.py', 'source_reader.py', 'models.py') }}-
      - run: pip install -r requirements.txt
      - name: 重新生成并原位覆盖2336结果
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from config import Settings
          from drive_client import DriveClient
          from pipeline import _parse_pdf_by_page, _load_channel, XLSX_MIME
          from pdf_renderer import extract_pdf_text_pages
          from matcher import match_with_priority
          from excel_writer import write_result, validate_result

          FILE_ID = '1Hy58HYm9TgDxLgtGkYCnU3bOeTFXS-e_'
          FILENAME = '#2336 T40退2220X2520.pdf'
          settings = Settings.from_env()
          drive = DriveClient()
          processing = drive.find_child_folder(settings.root_folder_id, settings.processing_folder_name)
          templates = drive.find_child_folder(settings.root_folder_id, settings.template_folder_name)
          results = drive.find_child_folder(settings.root_folder_id, settings.result_folder_name)

          with TemporaryDirectory(prefix='2336-fix-') as td:
              work = Path(td)
              pdf = work / '2336.pdf'
              drive.download(FILE_ID, pdf)
              page_texts = extract_pdf_text_pages(pdf)
              image, ocr_pages = _parse_pdf_by_page(FILENAME, pdf, page_texts, work / 'rendered')
              assert len(page_texts) == 2
              assert [p.index for p in image.parts] == list(range(1, 18))
              assert not ocr_pages
              primary = _load_channel(drive, processing['id'], settings.processing_folder_name, work)
              fallback = _load_channel(drive, templates['id'], settings.template_folder_name, work)
              matches = match_with_priority(image, primary, fallback)
              assert len(matches) == 17
              out = work / '#2336_完成.xlsx'
              write_result(out, image, matches)
              validate_result(out, expected_rows=17)
              result_id = drive.upsert_file(results['id'], out, XLSX_MIME)
              print(f'2336_FIXED_RESULT_ID={result_id}')
              print(f'2336_FIXED_PART_COUNT={len(matches)}')
              print(f'2336_FIXED_SPLIT_QTY_TOTAL={sum(p.split_quantity for p in image.parts)}')
              print('2336_FIX=PASS')
          PY
