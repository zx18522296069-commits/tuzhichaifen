<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="theme-color" content="#0b1220" />
<title>拆图控制台</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#0f172a;background:#f4f7fb;line-height:1.5;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#eef3f9 0,#f8fafc 45%,#fff 100%)}
button,input{font:inherit}.shell{max-width:1080px;margin:0 auto;padding:34px 22px 64px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}
.eyebrow{margin:0 0 6px;color:#64748b;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.top h1{margin:0;font-size:32px;letter-spacing:-.04em}.top p{margin:8px 0 0;color:#64748b}
.card{background:rgba(255,255,255,.92);border:1px solid #e2e8f0;border-radius:22px;box-shadow:0 18px 50px rgba(15,23,42,.08);padding:24px}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;align-items:stretch}
.task{position:relative;overflow:hidden}.task:before{content:"";position:absolute;inset:0 auto 0 0;width:5px;background:#7c3aed}.task h2{margin:4px 0 8px;font-size:26px}.muted{color:#64748b}.statusbox{display:flex;flex-direction:column;justify-content:space-between;background:#0b1220;color:#fff;border-radius:18px;padding:20px}
.badge{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:6px 10px;border-radius:999px;background:#1e293b;font-size:13px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:#94a3b8}
.badge.running .dot{background:#f59e0b}.badge.success .dot{background:#22c55e}.badge.failed .dot{background:#ef4444}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}.meta div{padding:12px 14px;border-radius:14px;background:#f8fafc;border:1px solid #edf2f7}.meta span{display:block;color:#64748b;font-size:12px}.meta strong{display:block;margin-top:4px;font-size:14px}
.actions{display:flex;gap:12px;margin-top:20px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:13px;padding:12px 18px;font-weight:800;cursor:pointer}.primary{background:#7c3aed;color:#fff;box-shadow:0 8px 22px color-mix(in srgb,#7c3aed 30%,transparent)}.secondary{background:#e2e8f0;color:#0f172a}.primary:disabled{opacity:.5;cursor:not-allowed}
.notice{margin-top:16px;padding:12px 14px;border-radius:13px;background:#eff6ff;color:#1e3a8a;font-size:14px}.notice.error{background:#fef2f2;color:#991b1b}.notice.ok{background:#f0fdf4;color:#166534}
.results{margin-top:20px}.results h2{margin:0 0 16px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.stat{padding:16px;border:1px solid #e2e8f0;border-radius:16px;background:#fff}.stat span{display:block;color:#64748b;font-size:12px}.stat strong{display:block;margin-top:4px;font-size:26px}
.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:minmax(120px,.7fr) minmax(150px,.8fr) 1.6fr;gap:12px;align-items:start;border:1px solid #e2e8f0;background:#fff;border-radius:14px;padding:13px}.row strong{word-break:break-word}.row small{color:#64748b}
.empty{padding:28px;text-align:center;color:#64748b;border:1px dashed #cbd5e1;border-radius:16px}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.links a{color:#7c3aed;text-decoration:none;font-weight:700}
.login{position:fixed;inset:0;background:rgba(2,6,23,.62);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;padding:22px;z-index:20}.loginbox{width:min(420px,100%);background:#fff;border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.25)}.loginbox h2{margin:4px 0 6px}.loginbox input{width:100%;margin:18px 0 12px;border:1px solid #cbd5e1;border-radius:12px;padding:12px 14px;outline:none}.loginbox input:focus{border-color:#7c3aed;box-shadow:0 0 0 3px color-mix(in srgb,#7c3aed 15%,transparent)}
.logout{border:1px solid #dbe3ed;background:#fff;border-radius:12px;padding:9px 13px;cursor:pointer;color:#475569}.hidden{display:none!important}
@media(max-width:760px){.hero{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top h1{font-size:27px}.shell{padding:22px 14px 48px}.top{align-items:center}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div><p class="eyebrow">火切生产中心 · Vercel</p><h1>拆图控制台</h1><p>独立执行待拆图纸扫描、匹配与拆图结果生成。</p></div>
    <button class="logout" id="logout">退出</button>
  </header>

  <section class="hero">
    <article class="card task">
      <p class="eyebrow">独立生产入口</p>
      <h2>图纸拆分</h2>
      <p class="muted">扫描待拆图纸，匹配订单基础资料并生成拆图结果 Excel。</p>
      <div class="meta">
        <div><span>GitHub 仓库</span><strong>tuzhichaifen</strong></div>
        <div><span>触发方式</span><strong>GitHub Actions · workflow_dispatch</strong></div>
      </div>
      <div class="actions">
        <button class="primary" id="run">立即执行</button>
        <button class="secondary" id="refresh">刷新状态</button>
        <button class="secondary" id="result">查看最近结果</button>
      </div>
      <div class="notice" id="notice">正在连接控制服务…</div>
    </article>

    <aside class="statusbox">
      <div>
        <p class="eyebrow" style="color:#94a3b8">当前状态</p>
        <span class="badge" id="badge"><span class="dot"></span><span id="statusText">读取中</span></span>
      </div>
      <div>
        <div style="color:#94a3b8;font-size:12px">最后执行</div>
        <strong id="updatedAt" style="display:block;margin-top:6px;font-size:18px">—</strong>
        <div id="detail" style="color:#cbd5e1;font-size:13px;margin-top:10px">—</div>
      </div>
    </aside>
  </section>

  <section class="card results">
    <h2>最近一次运行结果</h2>
    <div class="summary" id="summary">
      <div class="stat"><span>扫描</span><strong>—</strong></div>
      <div class="stat"><span>成功</span><strong>—</strong></div>
      <div class="stat"><span>未拆出</span><strong>—</strong></div>
      <div class="stat"><span>已跳过</span><strong>—</strong></div>
    </div>
    <div class="list" id="rows"><div class="empty">点击“查看最近结果”读取本次处理明细。</div></div>
    <div class="links" id="links"></div>
  </section>
</div>

<div class="login" id="login">
  <form class="loginbox" id="loginForm">
    <p class="eyebrow">内部操作验证</p>
    <h2>拆图控制台</h2>
    <p class="muted">请输入生产控制台操作口令。口令只保存在当前浏览器会话中。</p>
    <input id="key" type="password" autocomplete="current-password" placeholder="操作口令" />
    <button class="primary" style="width:100%" type="submit">进入</button>
    <div class="notice hidden" id="loginNotice"></div>
  </form>
</div>

<script>
const API='https://production-control-api.zx18522296069.chatgpt.site';
const TASK='split';
const RUN='/api/run/split';
const RESULT='/api/results/split';
const store='control-panel-key';
const active=new Set(['in_progress','queued','requested','waiting']);
const statusMap={success:'成功',partial:'部分完成',failure:'失败',cancelled:'已取消',in_progress:'运行中',queued:'排队中',requested:'已提交',waiting:'等待中',no_runs:'暂无记录',api_error:'读取失败',unknown:'未知'};
const $=id=>document.getElementById(id);

function key(){return sessionStorage.getItem(store)||''}
function setNotice(msg,type=''){ $('notice').className='notice '+type; $('notice').textContent=msg }
function fmt(v){ if(!v)return '—'; const d=new Date(v); return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(d) }
function authFail(msg){sessionStorage.removeItem(store);$('login').classList.remove('hidden');$('loginNotice').className='notice error';$('loginNotice').textContent=msg||'操作口令无效'}
async function req(path,opt={}){
  let res;
  try{res=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','X-Control-Key':key(),...(opt.headers||{})}})}
  catch{throw new Error('控制服务未连接')}
  const data=await res.json().catch(()=>({}));
  if(!res.ok||data.status==='error'){const m=data.detail||data.message||('请求失败（'+res.status+'）');if(res.status===401)authFail(m);throw new Error(m)}
  return data;
}
function setStatus(t){
  const s=(t&&t.status)||'unknown'; $('statusText').textContent=statusMap[s]||s;
  $('badge').className='badge '+(s==='success'?'success':active.has(s)||s==='partial'?'running':['failure','cancelled','api_error'].includes(s)?'failed':'');
  $('updatedAt').textContent=fmt(t&& (t.updated_at||t.run_started_at));
  $('detail').textContent=(t&&t.detail)||((t&&t.event)==='schedule'?'定时触发':(t&&t.event)?'手动触发':'—');
  $('run').disabled=active.has(s);
  $('run').textContent=active.has(s)?'任务运行中':'立即执行';
}
async function refresh(silent=false){
  try{const data=await req('/api/status');const t=data[TASK]||data.tasks?.[TASK]||{};setStatus(t);if(!silent)setNotice('状态已刷新','ok')}
  catch(e){if(!silent)setNotice(e.message,'error')}
}
function arr(v){return Array.isArray(v)?v:[]}
function titleOf(x){return x.board_id||x.title||x.filename||'未命名项目'}
function detailOf(x){return x.cause||x.reason||x.detail||x.record_status||'—'}
function render(data){
  const rows=$('rows'), links=$('links'); rows.innerHTML=''; links.innerHTML='';
  let total=0,success=0,third=0,fourth=0, items=[];
  if(TASK==='parts'){
    const m=new Map();
    [...arr(data.board_results),...arr(data.successes),...arr(data.issues)].forEach(x=>{const n=titleOf(x);if(/^#|^废/.test(n)||x.board_id)m.set(n,x)});
    items=[...m.values()];
    total=items.length;
    items.forEach(x=>{const s=String(x.record_status||'')+' '+detailOf(x); if(/补归档|重复/.test(s))third++; else if(/未累计|未记录|阻断|冲突|失败/.test(s))fourth++; else success++;});
  }else{
    const good=arr(data.successes), bad=arr(data.issues), skipped=arr(data.warnings);
    success=good.length; third=bad.length; fourth=skipped.length; total=Math.max(Number(data.completion?.total||0),success+third+fourth);
    items=[...bad.map(x=>({...x,_kind:'未拆出'})),...skipped.map(x=>({...x,_kind:'已跳过'})),...good.slice(0,30).map(x=>({...x,_kind:'成功'}))];
  }
  $('summary').innerHTML=
    '<div class="stat"><span>扫描</span><strong>'+total+'</strong></div>'+
    '<div class="stat"><span>成功</span><strong>'+success+'</strong></div>'+
    '<div class="stat"><span>未拆出</span><strong>'+third+'</strong></div>'+
    '<div class="stat"><span>已跳过</span><strong>'+fourth+'</strong></div>';
  if(!items.length){rows.innerHTML='<div class="empty">本次没有可展示的逐项结果。</div>'}
  else items.forEach(x=>{const el=document.createElement('div');el.className='row';el.innerHTML='<strong></strong><span></span><small></small>';el.children[0].textContent=titleOf(x);el.children[1].textContent=x._kind||x.record_status||'处理结果';el.children[2].textContent=detailOf(x);rows.appendChild(el)});
  arr(data.links).forEach(l=>{const a=document.createElement('a');a.href=l.url;a.target='_blank';a.rel='noreferrer';a.textContent=(l.label||'打开结果')+' ↗';links.appendChild(a)});
}
async function loadResult(){
  setNotice('正在读取最近结果…');
  try{const data=await req(RESULT);render(data);setNotice('最近结果已更新','ok')}catch(e){setNotice(e.message,'error')}
}
$('run').onclick=async()=>{if($('run').disabled)return; $('run').disabled=true;setNotice('正在提交任务…');try{await req(RUN,{method:'POST'});setNotice('任务已提交，正在等待 GitHub Actions 执行','ok');await refresh(true);setTimeout(()=>refresh(true),2500)}catch(e){setNotice(e.message,'error');$('run').disabled=false}};
$('refresh').onclick=()=>refresh();
$('result').onclick=()=>loadResult();
$('logout').onclick=()=>{sessionStorage.removeItem(store);$('login').classList.remove('hidden')};
$('loginForm').onsubmit=async e=>{e.preventDefault();const v=$('key').value.trim();if(!v)return;sessionStorage.setItem(store,v);$('loginNotice').className='notice';$('loginNotice').textContent='正在验证…';try{await refresh(true);$('login').classList.add('hidden');$('key').value='';$('loginNotice').className='notice hidden';setNotice('控制服务已连接','ok')}catch(err){authFail(err.message)}};
if(key()){$('login').classList.add('hidden');refresh(true)} else {$('login').classList.remove('hidden')}
setInterval(()=>{if(key())refresh(true)},10000);
</script>
</body>
</html>
